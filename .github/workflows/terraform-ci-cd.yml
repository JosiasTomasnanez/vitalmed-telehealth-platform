name: Terraform CI/CD

on:
  push:
    branches: [main, staging]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: "1.10.0"

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================================
  # ETAPA DE CALIDAD Y PRUEBAS (Real - Secuencial en Pull Requests)
  # =============================================================================
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init & Validate
        run: |
          find terraform/environments -type f -name "main.tf" | while read -r main_file; do
            dir=$(dirname "$main_file")
            cd "$dir"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

  tflint:
    name: Ejecutar TFLint
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Init & Run TFLint
        run: |
          tflint --init
          tflint --recursive
        working-directory: terraform

  checkov:
    name: Ejecutar Checkov
    runs-on: ubuntu-latest
    needs: [tflint]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  test:
    name: Ejecutar Tests
    runs-on: ubuntu-latest
    needs: [checkov]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Run Terraform Tests
        env:
          AWS_ACCESS_KEY_ID: "mock_access_key"
          AWS_SECRET_ACCESS_KEY: "mock_secret_key"
          AWS_REGION: "us-east-1"
        run: |
          for module_dir in terraform/modules/*/; do
            if [ -d "${module_dir}tests" ]; then
              cd "$module_dir"
              terraform init -backend=false
              terraform test
              cd - > /dev/null
            fi
          done

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [validate, tflint, checkov, test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Verificar resultado de todas las pruebas
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.tflint.result }}" != "success" ] || \
             [ "${{ needs.checkov.result }}" == "failure" -a "${{ needs.checkov.outputs.failed_checks }}" != "" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "Uno o más análisis de código obligatorios fallaron."
            exit 1
          fi
          echo "Todas las validaciones reales pasaron exitosamente en secuencia."

  # =============================================================================
  # ETAPA DE DESPLIEGUE A PREPRODUCCIÓN (MOCK - Solo en Push a STAGING)
  # =============================================================================
  deploy-preprod:
    name: 4. Deploy Preprod Global (Staging - Mock)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Simulando Despliegue en Preproducción
        run: |
          echo "================================================================"
          echo " [MOCK] INICIANDO DESPLIEGUE EN ENTORNO: PREPRODUCCIÓN GLOBAL"
          echo "================================================================"
          echo "Directorio de trabajo: terraform/environments/preprod"
          echo "Asumiendo Cuenta AWS Objetivo Ficticia: aws-preprod-99999"
          echo "=> Ejecutando simulado: terraform init"
          sleep 1
          echo "=> Ejecutando simulado: terraform plan -out=tfplan"
          sleep 1
          echo "=> Ejecutando simulado: terraform apply -auto-approve tfplan"
          sleep 2
          echo "¡Infraestructura de Preproducción simulada con éxito!"

  # =============================================================================
  # ETAPA DE DESPLIEGUE CORE Y PRODUCCIÓN (MOCK - Solo en Push a MAIN)
  # =============================================================================
  deploy-backend:
    name: 1. Deploy State Backend (Main - Mock)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Simulando Creación de Backend Local
        run: |
          echo "================================================================"
          echo " [MOCK] FASE 1: DESPLIEGUE DE STATE BACKEND LOCAL (Management)"
          echo "================================================================"
          echo "Directorio de trabajo: terraform/global/state-backend"
          echo "=> Ejecutando simulado: terraform init (backend local)"
          sleep 1
          echo "=> Ejecutando simulado: terraform plan -out=tfplan"
          sleep 1
          echo "=> Ejecutando simulado: terraform apply -auto-approve tfplan"
          sleep 2
          echo "   -> Creando Bucket S3 base para guardar estados futuros..."
          echo "Backend base listo en la cuenta de administración principal (State Locking via native lockfile)."

  deploy-org:
    name: 2. Deploy Organization Accounts (Main - Mock)
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      prod_account_ids: ${{ steps.mock-outputs.outputs.prod_account_ids }}
    steps:
      - name: Simulando Terraform Apply de AWS Organizations
        run: |
          echo "================================================================"
          echo " [MOCK] FASE 2: CREACIÓN DE CUENTAS MIEMBRO (AWS Organizations)"
          echo "================================================================"
          echo "Directorio de trabajo: terraform/org"
          echo "=> Ejecutando simulado: terraform init (Migrando a Backend Remoto S3 recién creado)"
          sleep 1
          echo "=> Ejecutando simulado: terraform plan -out=tfplan"
          sleep 1
          echo "=> Ejecutando simulado: terraform apply -auto-approve tfplan"
          sleep 2
          echo "   -> Creando cuenta: prod-ar..."
          echo "   -> Creando cuenta: prod-cl..."
          echo "   -> Creando cuenta: prod-co..."
          echo "   -> Creando cuenta: prod-mx..."
          echo "Estructura organizativa simulada correctamente."

      - name: Generar e Inyectar Outputs Simulados
        id: mock-outputs
        run: |
          MOCK_JSON='{"ar":"aws-account-ar-1111","cl":"aws-account-cl-2222","co":"aws-account-co-3332","mx":"aws-account-mx-4444"}'
          echo "prod_account_ids=$MOCK_JSON" >> $GITHUB_OUTPUT

  deploy-prod:
    name: 3. Deploy Prod (${{ matrix.country }}) (Main - Mock)
    runs-on: ubuntu-latest
    needs: [deploy-org]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        country: [ar, cl, co, mx]
    steps:
      - name: Parsear ID de Cuenta e Iniciar Aplicación Territorial
        run: |
          SIMULATED_ID=$(echo '${{ needs.deploy-org.outputs.prod_account_ids }}' | jq -r '.["${{ matrix.country }}"]')
          
          echo "================================================================"
          echo " [MOCK] FASE 3: APLICANDO ENTORNO PRODUCCIÓN PAÍS: [${{ matrix.country }}]"
          echo "================================================================"
          echo "Directorio de trabajo: terraform/environments/${{ matrix.country }}/prod"
          echo "Conectando de manera simulada a la cuenta miembro: $SIMULATED_ID"
          echo "Asumiendo rol: arn:aws:iam::$SIMULATED_ID:role/OrganizationAccountAccessRole"
          echo "=> Ejecutando simulado: terraform init"
          sleep 1
          echo "=> Ejecutando simulado: terraform plan -out=tfplan"
          sleep 1
          echo "=> Ejecutando simulado: terraform apply -auto-approve tfplan"
          sleep 2
          echo "Despliegue finalizado de forma simulada en la región de ${{ matrix.country }}."
