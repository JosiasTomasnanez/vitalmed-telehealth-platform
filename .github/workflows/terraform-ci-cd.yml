name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: "1.10.0"
  AWS_REGION: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================================
  # Job 1: Validación de código
  # =============================================================================
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init & Validate & Plan
        run: |
          find terraform/environments -type f -name "main.tf" | while read -r main_file; do
            dir=$(dirname "$main_file")
            echo "=========================================="
            echo "Procesando entorno: $dir"
            echo "=========================================="
            cd "$dir"
            terraform init -backend=false
            terraform validate
            terraform plan -input=false -no-color 2>&1 | head -n 40
            cd - > /dev/null
          done

  # =============================================================================
  # Job 2: Tests de Terraform
  # =============================================================================
  test:
    name: Ejecutar Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Run Terraform Tests
        run: |
          for module_dir in terraform/modules/*/; do
            if [ -d "${module_dir}tests" ]; then
              echo "=== Tests: $module_dir ==="
              cd "$module_dir"
              terraform test
              cd - > /dev/null
            fi
          done

  # =============================================================================
  # Job 3: Despliegue a Preproducción Global (Merge a main)
  # =============================================================================
  deploy-preprod:
    name: Desplegar Preproducción Global
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: preprod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/preprod
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/preprod
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/preprod
        run: terraform apply -auto-approve tfplan

  # =============================================================================
  # Job 4: Despliegue a Producción Multipaís (Merge a main)
  # =============================================================================
  deploy-prod:
    name: Desplegar Producción
    runs-on: ubuntu-latest
    needs: [validate, test, deploy-preprod]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        country: [ar, cl, co, mx]
    environment: prod-${{ matrix.country }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.country }}/prod
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/${{ matrix.country }}/prod
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/${{ matrix.country }}/prod
        run: terraform apply -auto-approve tfplan
