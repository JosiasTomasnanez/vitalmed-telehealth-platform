# =============================================================================
# Pipeline CI/CD para Terraform — VitalMed Telesalud
# =============================================================================
# Este pipeline valida el código Terraform en cada PR y despliega automáticamente
# a los entornos de preproducción cuando se hace merge en main.
#
# Referencia: AWS Well-Architected Framework — Pilar Excelencia Operativa
# - Automatización de despliegues
# - Validación antes de producir
# - Trazabilidad de cambios
# =============================================================================

name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: "1.10.0"
  AWS_REGION: "us-east-1"

permissions:
  id-token: write   # Para OIDC con AWS
  contents: read    # Para leer el repo

jobs:
  # =============================================================================
  # Job 1: Validación de código (en todos los PRs)
  # =============================================================================
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init (Backend False)
        run: |
          for dir in terraform/environments/*/*/; do
            if [ -f "$dir/main.tf" ]; then
              echo "=== Init: $dir ==="
              cd "$dir"
              terraform init -backend=false
              cd -
            fi
          done

      - name: Terraform Validate
        run: |
          for dir in terraform/environments/*/*/; do
            if [ -f "$dir/main.tf" ]; then
              echo "=== Validate: $dir ==="
              cd "$dir"
              terraform validate
              cd -
            fi
          done

      - name: Terraform Plan (Dry Run)
        run: |
          for dir in terraform/environments/*/*/; do
            if [ -f "$dir/main.tf" ]; then
              echo "=== Plan: $dir ==="
              cd "$dir"
              terraform plan -input=false -no-color 2>&1 | head -50
              cd -
            fi
          done

  # =============================================================================
  # Job 2: Tests de Terraform (en todos los PRs)
  # =============================================================================
  test:
    name: Ejecutar Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Run Terraform Tests
        run: |
          for module_dir in terraform/modules/*/; do
            if [ -d "${module_dir}tests" ]; then
              echo "=== Tests: $module_dir ==="
              cd "$module_dir"
              terraform test
              cd -
            fi
          done

  # =============================================================================
  # Job 3: Despliegue a Preproducción (solo en merge a main)
  # =============================================================================
  deploy-preprod:
    name: Desplegar Preproducción
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        country: [ar, cl, co, mx]
    environment: preprod-${{ matrix.country }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.country }}/preprod
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/${{ matrix.country }}/preprod
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/${{ matrix.country }}/preprod
        run: terraform apply -auto-approve tfplan

      - name: Post-Deploy Validation
        working-directory: terraform/environments/${{ matrix.country }}/preprod
        run: |
          echo "=== Validación post-despliegue ==="
          echo "Verificando que los recursos críticos existen..."
          terraform output -json | python3 -c "
          import json, sys
          outputs = json.load(sys.stdin)
          required = ['vpc_id', 'alb_dns_name']
          for key in required:
              if key not in outputs:
                  print(f'ERROR: Output {key} no encontrado')
                  sys.exit(1)
              print(f'OK: {key} = {outputs[key][\"value\"][:50]}...')
          "

  # =============================================================================
  # Job 4: Despliegue a Producción (manual, con aprobación)
  # =============================================================================
  deploy-prod:
    name: Desplegar Producción
    runs-on: ubuntu-latest
    needs: [validate, test, deploy-preprod]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        country: [ar, cl, co, mx]
    environment: prod-${{ matrix.country }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.country }}/prod
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/${{ matrix.country }}/prod
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/${{ matrix.country }}/prod
        run: terraform apply -auto-approve tfplan

      - name: Post-Deploy Validation
        working-directory: terraform/environments/${{ matrix.country }}/prod
        run: |
          echo "=== Validación post-despliegue Producción ==="
          echo "Verificando que los recursos críticos existen..."
          terraform output -json | python3 -c "
          import json, sys
          outputs = json.load(sys.stdin)
          required = ['vpc_id', 'alb_dns_name', 'aurora_endpoint']
          for key in required:
              if key not in outputs:
                  print(f'ERROR: Output {key} no encontrado')
                  sys.exit(1)
              print(f'OK: {key} = {outputs[key][\"value\"][:50]}...')
          "

      - name: Notify Success
        if: success()
        run: |
          echo "=== Despliegue exitoso ==="
          echo "País: ${{ matrix.country }}"
          echo "Entorno: prod"
          echo "Commit: ${{ github.sha }}"
